<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ton aventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bonjour Alicia!</h1>
        <p>Merci d'avoir scanné ce porte clé!</p>
        <p>Voilà quelques activité du jour..</p>
    </header>
    <main>
        <section>
            <h2>🔮 Mot du jour</h2>
            <p id="motDuJour">
                Clique pour découvrir ton message.
            </p>
            <button onclick="nouveauMessage()">
                Clique ici!
            </button>
        </section>
        <section>
            <h2>🎮 Mini-jeu</h2>
            <p>Une épreuve t'attend...</p>
            <button onclick="lancerJeu()">
                Jouer
            </button>
            <p id="jeu"></p>
        </section>
        <section>
            <h2>🔒 Quête secrète</h2>
            <p>
                Certaines récompenses doivent être méritées.
            </p>
            <button onclick="queteSecrete()">
                Tenter d'ouvrir
            </button>
            <p id="secret"></p>
        </section>
    </main>
    <footer>
        <p>Made with ❤️ par Maumau!</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
